name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, test and lint (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build
        run: cargo build --locked

      # Includes the checks that every @tr() string has a Spanish translation,
      # that the JSON schema covers every option and that every key the UI
      # writes exists.
      - name: Unit tests
        run: cargo test --locked

      # Clipboard, window-guard and notification tests need a desktop session;
      # hosted runners usually have one, but don't block on it.
      - name: Desktop integration tests
        run: cargo test --locked -- --ignored --skip downloads_a_folder --test-threads=1
        continue-on-error: true

      - name: Clippy
        run: cargo clippy --locked --all-targets
