[package]
name = "caelestia-win"
version = "0.1.1"
edition = "2024"
rust-version = "1.92"
description = "A Caelestia-inspired desktop shell for Windows, written in Rust + Slint"
license = "GPL-3.0-only"
build = "build.rs"

[[bin]]
name = "caelestia"
path = "src/main.rs"

[dependencies]
slint = { version = "~1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "accessibility",
    "unstable-winit-030",
    "unstable-fontique-011",
    "raw-window-handle-06",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
dirs = "6"
notify-debouncer-mini = "0.7"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "network"] }
material-colors = { version = "0.5", features = ["quantize"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
chrono = { version = "0.4", features = ["unstable-locales"] }
nucleo-matcher = "0.3"
emojis = "0.9"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
# SHA-256 of downloaded updates (already used by rustls, no new crate).
ring = "0.17"
crossbeam-channel = "0.5"
raw-window-handle = "0.6"
rfd = { version = "0.17.2", default-features = false }
wmi = "0.18"
windows-collections = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "ApplicationModel",
    "UI_Notifications",
    "UI_Notifications_Management",
    "Devices_Radios",
    "Devices_Bluetooth",
    "Devices_Geolocation",
    "Devices_Enumeration",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_KernelStreaming",
    "Networking_Connectivity",
    "Storage_Streams",
    "Win32_UI_Controls",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_RemoteDesktop",
    "Wdk_Graphics_Direct3D",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Graphics_Direct3D9",
] }

[build-dependencies]
slint-build = "~1.18"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true

[profile.dev.package."*"]
opt-level = 2
